name: omni-lean-build

on:
  push:
    paths:
      - 'lean/**'
      - '.github/workflows/omni-lean-build.yml'
  pull_request:
    paths:
      - 'lean/**'
  workflow_dispatch:
    inputs:
      target_theorem:
        description: 'Target theorem to prove (e.g., T-THEO-0009)'
        required: false
        default: 'all'
      atp_mode:
        description: 'ATP mode (copra/deepseek/bfs/formalflow/auto)'
        required: false
        default: 'auto'
  repository_dispatch:
    types: [lean-build, atp-trigger, sorry-fill]

permissions:
  contents: write
  actions: read

env:
  MATHLIB_CACHE_DIR: ~/.cache/mathlib

jobs:
  # ==========================================================================
  # Stage 1: Lean Build + Sorry Scan
  # ==========================================================================
  build-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sorry_count: ${{ steps.scan.outputs.sorry_count }}
      theorem_count: ${{ steps.scan.outputs.theorem_count }}
      sorry_free: ${{ steps.scan.outputs.sorry_free }}
      build_rc: ${{ steps.build.outputs.rc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Mathlib
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mathlib
            lean/.lake
          key: mathlib-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.lean') }}
          restore-keys: mathlib-${{ runner.os }}-

      - name: Install elan + Lean toolchain
        run: |
          set -e
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lean --version
          lake --version

      - name: lake build (with Mathlib)
        id: build
        run: |
          set +e
          cd lean
          start=$(date +%s)
          lake build > /tmp/lake-build.log 2>&1
          rc=$?
          end=$(date +%s)
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "secs=$((end-start))" >> "$GITHUB_OUTPUT"
          tail -50 /tmp/lake-build.log
          exit 0

      - name: Sorry Scan + Theorem Inventory
        id: scan
        if: always()
        run: |
          python3 - <<'PY'
          import re, pathlib, json, os
          
          src_dir = pathlib.Path("lean/OMNIHUB")
          all_lean = list(src_dir.rglob("*.lean"))
          
          total_sorry = 0
          total_theorems = 0
          theorem_list = []
          sorry_locations = []
          
          for p in all_lean:
              text = p.read_text()
              # Strip comments for accurate sorry count
              no_line = re.sub(r"--[^\n]*", "", text)
              no_block = re.sub(r"/-.*?-/", "", no_line, flags=re.S)
              
              sorrys = len(re.findall(r"\bsorry\b", no_block))
              total_sorry += sorrys
              
              # Find theorem definitions (including commented-out academic annotations)
              theorems = re.findall(r"^theorem\s+([A-Za-z0-9_'.]+)", text, flags=re.M)
              total_theorems += len(theorems)
              theorem_list.extend(theorems)
              
              if sorrys > 0:
                  for i, line in enumerate(text.split("\n"), 1):
                      if re.search(r"\bsorry\b", re.sub(r"--[^\n]*", "", line)):
                          sorry_locations.append({
                              "file": str(p.relative_to("lean")),
                              "line": i,
                              "theorem_context": ""
                          })
          
          sorry_free = total_sorry == 0
          
          print(f"::set-output name=sorry_count::{total_sorry}")
          print(f"::set-output name=theorem_count::{total_theorems}")
          print(f"::set-output name=sorry_free::{str(sorry_free).lower()}")
          
          # Write scan results
          scan_result = {
              "timestamp": os.popen("date -u +%Y-%m-%dT%H:%M:%SZ").read().strip(),
              "sorry_count": total_sorry,
              "theorem_count": total_theorems,
              "sorry_free": sorry_free,
              "theorems": theorem_list,
              "sorry_locations": sorry_locations[:50]  # Limit output
          }
          pathlib.Path("lean/results").mkdir(parents=True, exist_ok=True)
          with open("lean/results/sorry-scan-latest.json", "w") as f:
              json.dump(scan_result, f, indent=2)
          
          print(f"\n📊 Scan Results:")
          print(f"   Theorems: {total_theorems}")
          print(f"   Sorry:    {total_sorry}")
          print(f"   Sorry-free: {sorry_free}")
          PY

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sorry-scan-results
          path: lean/results/sorry-scan-latest.json

  # ==========================================================================
  # Stage 2: ATP Saturation Attack (Parallel Tool Execution)
  # ==========================================================================
  atp-saturation:
    needs: build-and-scan
    if: needs.build-and-scan.outputs.sorry_free == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        tool:
          - { name: "copra", tier: "tier1", target: "T-THEO-0009" }
          - { name: "bfs-prover", tier: "tier1", target: "T-THEO-0008" }
          - { name: "deepseek-prover", tier: "tier2", target: "T-THEO-0003" }
          - { name: "formalflow", tier: "tier2", target: "T-THEO-0002" }
          - { name: "leandojo-reprover", tier: "tier1", target: "all" }
          - { name: "goedel-architect", tier: "tier2", target: "T-THEO-0001" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Mathlib
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mathlib
            lean/.lake
          key: mathlib-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.lean') }}

      - name: Install elan + Lean toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Setup ${{ matrix.tool.name }}
        run: |
          echo "Setting up ${{ matrix.tool.name }} (${{ matrix.tool.tier }})..."
          case "${{ matrix.tool.name }}" in
            copra)
              pip install openai lean-dojo tqdm 2>/dev/null || true
              ;;
            bfs-prover)
              pip install transformers torch numpy 2>/dev/null || true
              ;;
            deepseek-prover)
              pip install torch transformers vllm 2>/dev/null || true
              ;;
            formalflow)
              echo "FormalFlow: Clone MIPStarRE repo for reference"
              git clone --depth 1 https://github.com/LionSR/MIPStarRE.git /tmp/MIPStarRE || true
              ;;
            leandojo-reprover)
              pip install lean-dojo transformers 2>/dev/null || true
              ;;
            goedel-architect)
              pip install openai jsonschema 2>/dev/null || true
              ;;
          esac

      - name: Run ATP — ${{ matrix.tool.name }} on ${{ matrix.tool.target }}
        id: atp
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 lean/atp/run_${{ matrix.tool.name }}.py \
            --target "${{ matrix.tool.target }}" \
            --debt-file "lean/OMNIHUB/DebtTheorems.lean" \
            --output "lean/results/atp-${{ matrix.tool.name }}.json" \
            --timeout 1800 \
            2>&1 | tee /tmp/atp-${{ matrix.tool.name }}.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload ATP results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atp-${{ matrix.tool.name }}-results
          path: |
            lean/results/atp-${{ matrix.tool.name }}.json
            /tmp/atp-${{ matrix.tool.name }}.log

  # ==========================================================================
  # Stage 3: Result Aggregation + Auto-Fill
  # ==========================================================================
  aggregate-and-fill:
    needs: [build-and-scan, atp-saturation]
    if: always() && needs.build-and-scan.outputs.sorry_free == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all ATP artifacts
        uses: actions/download-artifact@v4
        with:
          path: lean/results/artifacts
          pattern: atp-*-results

      - name: Aggregate results + Auto-fill proven sorry
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          
          results_dir = pathlib.Path("lean/results/artifacts")
          aggregated = {"tools": [], "proved": [], "partial": [], "failed": []}
          
          for tool_dir in results_dir.glob("atp-*"):
              result_file = tool_dir / f"atp-{tool_dir.name.replace('atp-', '').replace('-results', '')}.json"
              if result_file.exists():
                  data = json.loads(result_file.read_text())
                  aggregated["tools"].append(data)
                  aggregated["proved"].extend(data.get("proved", []))
                  aggregated["partial"].extend(data.get("partial", []))
                  aggregated["failed"].extend(data.get("failed", []))
          
          # Write aggregate
          pathlib.Path("lean/results").mkdir(exist_ok=True)
          with open("lean/results/atp-aggregate-latest.json", "w") as f:
              json.dump(aggregated, f, indent=2)
          
          print(f"Aggregated: {len(aggregated['proved'])} proved, "
                f"{len(aggregated['partial'])} partial, "
                f"{len(aggregated['failed'])} failed")
          PY

      - name: Commit filled results
        if: always()
        run: |
          git config user.name "OMNI-HUB ATP Bot"
          git config user.email "atp@omni-hub.ai"
          git add lean/results/
          git diff --cached --quiet || git commit -m "🤖 ATP results aggregation [skip ci]"
          git push || echo "No changes to push"

  # ==========================================================================
  # Stage 4: Verification Build (post-fill)
  # ==========================================================================
  verify-build:
    needs: aggregate-and-fill
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Mathlib
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mathlib
            lean/.lake
          key: mathlib-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.lean') }}

      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Final verification build
        run: |
          cd lean
          lake build
          echo "✅ Verification build passed"

      - name: Generate final report
        run: |
          python3 - <<'PY'
          import json, pathlib, re, datetime
          
          src_dir = pathlib.Path("lean/OMNIHUB")
          all_lean = list(src_dir.rglob("*.lean"))
          
          total_sorry = 0
          total_theorems = 0
          
          for p in all_lean:
              text = p.read_text()
              no_line = re.sub(r"--[^\n]*", "", text)
              no_block = re.sub(r"/-.*?-/", "", no_line, flags=re.S)
              total_sorry += len(re.findall(r"\bsorry\b", no_block))
              total_theorems += len(re.findall(r"^theorem\s+", text, flags=re.M))
          
          report = {
              "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "theorems": total_theorems,
              "sorry_remaining": total_sorry,
              "clearance_rate": (1 - total_sorry / max(total_sorry + 1, 1)) * 100,
              "status": "sorry_free" if total_sorry == 0 else "in_progress"
          }
          
          pathlib.Path("lean/results").mkdir(exist_ok=True)
          with open("lean/results/final-report-latest.json", "w") as f:
              json.dump(report, f, indent=2)
          
          print(f"\n{'='*60}")
          print(f"📊 OMNI-HUB Lean Verification Report")
          print(f"{'='*60}")
          print(f"Theorems:     {total_theorems}")
          print(f"Sorry:        {total_sorry}")
          print(f"Clearance:    {report['clearance_rate']:.1f}%")
          print(f"Status:       {report['status']}")
          print(f"{'='*60}")
          PY
